- name: error handling
  hosts: frontend
  tasks:
    - name: Check if user exists
      ansible.builtin.command: id anilkumar
      register: user_check
      ignore_errors: yes

    - name: User already exists (skip creation)
      ansible.builtin.debug:
        msg: "User 'anilkumar' already exists. Skipping creation."
      when: user_check.rc == 0

    - name: Create user if not exists
      ansible.builtin.user:
        name: anilkumar
        state: present
      when: user_check.rc != 0
